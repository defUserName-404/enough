<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="enough.css"></head>
<body>
<div class="status"></div>
<div class="screen">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
    <h2 style="font-size:30px">Enough</h2>
    <div class="iconbtn" data-ico="gear" style="background:var(--fg);color:var(--bg)"></div>
  </div>
  <div class="label" style="margin-top:6px;color:var(--fg)">Sat 21 Nov · active</div>

  <div style="margin-top:20px">
    <div class="label" style="color:var(--fg)">Screen time today</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
      <div class="mono" style="font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1">6H 12M</div>
      <div class="link">Usage →</div>
    </div>
    <div class="label" style="margin-top:8px;color:var(--fg)">Limited apps · 1H 06M</div>
  </div>

  <div class="tabs" style="margin-top:18px"><div>LIMITS</div><div class="on">PENDING · 2</div></div>

  <!-- no "waiting 24h" header: each countdown already says it -->
  <div style="margin-top:6px">
    <div class="row" style="display:block">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span class="name">Instagram</span><span class="mono" style="font-size:13px;font-weight:700">20M → 40M</span>
      </div>
      <div class="mono" style="font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:8px">23H 12M LEFT</div>
      <div class="btn sm" style="margin-top:12px">Cancel request</div>
    </div>
    <div class="row" style="display:block">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span class="name">TikTok</span><span class="mono" style="font-size:13px;font-weight:700">REMOVE</span>
      </div>
      <div class="mono" style="font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:8px">07H 45M LEFT</div>
      <div class="btn sm" style="margin-top:12px">Cancel request</div>
    </div>
  </div>

  <div class="grow"></div>
</div>
<script src="enough.js"></script><script src="icons.js"></script>
</body></html>
