<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="clamp.css"></head>
<body>
<iframe src="03-home.html" style="position:absolute;inset:0;width:393px;height:873px;border:0"></iframe>
<div class="scrim"></div>
<div style="position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--fg);padding:22px 20px 24px">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div style="display:flex;gap:12px;align-items:center"><div class="icon app" data-app="instagram"></div><h2>Instagram</h2></div>
    <div class="mono" style="font-size:18px">✕</div>
  </div>

  <div class="label" style="margin-top:26px">Daily limit · now 20:00</div>
  <div style="display:flex;align-items:stretch;border:2px solid var(--fg);height:96px;margin-top:10px">
    <div class="mono" style="width:76px;display:grid;place-items:center;font-size:30px;font-weight:700;border-right:2px solid var(--fg)">–</div>
    <div class="mono grow" style="display:grid;place-items:center;font-size:52px;font-weight:800;letter-spacing:-2px">40M</div>
    <div class="mono" style="width:76px;display:grid;place-items:center;font-size:30px;font-weight:700;border-left:2px solid var(--fg);background:var(--fg);color:var(--bg)">+</div>
  </div>

  <div class="box red" style="margin-top:14px;padding:12px 14px">
    <div class="mono red" style="font-size:12px;font-weight:800;letter-spacing:1.6px">↑ RAISING = LOOSENING</div>
    <div class="body" style="margin-top:6px;font-size:13.5px">Applies in 24h. No override. Lowering always applies instantly.</div>
  </div>

  <div class="btns" style="margin-top:18px">
    <div class="btn danger sm" style="height:56px">Remove</div>
    <div class="btn primary" style="flex:2">Request · 24h</div>
  </div>
</div>
<script src="clamp.js"></script><script src="icons.js"></script>
</body></html>
