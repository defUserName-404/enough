<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="enough.css"></head>
<body>
<div class="status"></div>
<div class="screen">
  <div style="display:flex;align-items:center;gap:14px;margin-top:10px">
    <div class="iconbtn" data-ico="back"></div>
    <h2 style="font-size:30px">Settings</h2>
  </div>

  <div class="box" style="margin-top:24px">
    <div class="label" style="color:var(--fg);font-size:12px">Update</div>
    <div class="body" style="font-size:13.5px;margin-top:6px">VERSION 1.1.2</div>
    <div style="display:flex;align-items:center;gap:16px;margin-top:14px">
      <div class="ring" data-pct="42" data-size="64"></div>
      <div><div class="label" style="color:var(--fg);font-size:12px">Downloading</div><div class="body" style="font-size:13.5px;margin-top:4px">INSTALLS WHEN DONE</div></div>
    </div>
  </div>

  <div class="box red" style="margin-top:16px">
    <div class="label red" style="font-size:12px">Uninstall</div>
    <div style="font:400 13.5px/1.4 'Space Grotesk',sans-serif;margin-top:6px">Turns off every block and the uninstall protection, so you can uninstall it like any other app. Starts after a 24h wait.</div>
    <div class="btn sm danger" style="margin-top:14px">Start uninstall · 24h</div>
  </div>

  <div class="grow"></div>
  <div class="label" style="text-align:center">No accounts · internet only for updates</div>
</div>
<script src="enough.js"></script><script src="icons.js"></script>
</body></html>
