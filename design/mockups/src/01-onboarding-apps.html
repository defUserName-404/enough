<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="enough.css"></head>
<body>
<div class="status"></div>
<div class="screen">
  <div class="label" style="margin-top:12px">Setup · 01 / 02</div>
  <h1 style="margin-top:14px">What eats<br>your time?</h1>
  <p class="body" style="margin-top:14px">Pick the apps. Give each a daily limit. When it runs out, the app is gone until midnight.</p>

  <div class="input" style="margin-top:22px"><span style="color:var(--fg)">⌕</span> Search apps<span class="cursor"></span></div>

  <div style="margin-top:18px">
    <div class="row">
      <div class="check on">✓</div><div class="icon app" data-app="instagram"></div>
      <div class="grow"><div class="name">Instagram</div><div class="label" style="margin-top:4px">min / day</div></div>
      <div class="step"><span>–</span><b>20</b><span>+</span></div>
    </div>
    <div class="row">
      <div class="check on">✓</div><div class="icon app" data-app="youtube"></div>
      <div class="grow"><div class="name">YouTube</div><div class="label" style="margin-top:4px">min / day</div></div>
      <div class="step"><span>–</span><b>30</b><span>+</span></div>
    </div>
    <div class="row">
      <div class="check on">✓</div><div class="icon app" data-app="reddit"></div>
      <div class="grow"><div class="name">Reddit</div><div class="label" style="margin-top:4px">min / day</div></div>
      <div class="step"><span>–</span><b>15</b><span>+</span></div>
    </div>
    <div class="row">
      <div class="check"></div><div class="icon app" data-app="tiktok"></div>
      <div class="grow"><div class="name" style="color:var(--dim)">TikTok</div></div>
    </div>
    <div class="row">
      <div class="check"></div><div class="icon app" data-app="x"></div>
      <div class="grow"><div class="name" style="color:var(--dim)">X</div></div>
    </div>
    <div class="row">
      <div class="check"></div><div class="icon app" data-app="chrome"></div>
      <div class="grow"><div class="name" style="color:var(--dim)">Chrome</div></div>
    </div>
  </div>

  <div class="grow"></div>
  <div class="hr"></div>
  <div style="display:flex;justify-content:space-between;margin:14px 0" class="label">
    <span style="color:var(--fg)">3 apps</span><span style="color:var(--fg)">65 min / day</span>
  </div>
  <div class="btn primary">Next →</div>
</div>
<script src="enough.js"></script><script src="icons.js"></script>
</body></html>
