<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="enough.css"></head>
<body>
<div class="status"></div>
<div class="screen">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
    <h2 style="font-size:30px">Enough</h2>
    <div class="mono" style="font-size:20px;letter-spacing:2px">▪▪</div>
  </div>
  <div class="label" style="margin-top:6px">Sat 21 Nov · active</div>

  <div style="margin-top:20px">
    <div class="label">Screen time today</div>
    <div class="mono" style="font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1;margin-top:6px">6H 12M</div>
    <div class="label" style="margin-top:8px;color:var(--fg)">Limited apps · 1H 06M</div>
  </div>

  <div class="tabs2" style="display:flex;border:2px solid var(--fg);margin-top:18px">
    <div style="flex:1;height:40px;display:grid;place-items:center;background:var(--fg);color:var(--bg);font:700 12px 'JetBrains Mono',monospace;letter-spacing:1.8px">LIMITS</div>
    <div style="flex:1;height:40px;display:grid;place-items:center;font:700 12px 'JetBrains Mono',monospace;letter-spacing:1.8px">USAGE</div>
  </div>

  <div style="margin-top:6px">
    <div class="row">
      <div class="icon app" data-app="instagram"></div>
      <div class="grow">
        <div style="display:flex;justify-content:space-between"><span class="name">Instagram</span><span class="mono" style="font-size:13px;font-weight:700">12M / 20M</span></div>
        <div class="bar" data-n="13"></div>
      </div>
    </div>
    <div class="row">
      <div class="icon app locked" data-app="youtube"></div>
      <div class="grow">
        <div style="display:flex;justify-content:space-between"><span class="name red">YouTube</span><span class="mono red" style="font-size:13px;font-weight:800;letter-spacing:1.5px">LOCKED</span></div>
        <div class="bar red" data-n="20"></div>
        <div class="label" style="margin-top:6px">30M / 30M · opens 00:00</div>
      </div>
    </div>
    <div class="row">
      <div class="icon app" data-app="reddit"></div>
      <div class="grow">
        <div style="display:flex;justify-content:space-between"><span class="name">Reddit</span><span class="mono" style="font-size:13px;font-weight:700">5M / 15M</span></div>
        <div class="bar" data-n="7"></div>
      </div>
    </div>
  </div>

  <div class="box" style="margin-top:16px">
    <div style="display:flex;justify-content:space-between"><span class="label" style="color:var(--fg)">Pending · 1</span><span class="label">waiting 24h</span></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:10px">
      <span class="name">Instagram</span><span class="mono" style="font-size:13px;font-weight:700">20M → 40M</span>
    </div>
    <div class="mono" style="font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:8px">23H 12M LEFT</div>
    <div class="btn sm" style="margin-top:12px">Cancel request</div>
  </div>

  <div class="grow"></div>
  <div class="btn">[ + Add app ]</div>
</div>
<script src="enough.js"></script><script src="icons.js"></script>
</body></html>
