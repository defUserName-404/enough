name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ENOUGH_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::ENOUGH_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ENOUGH_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed release
        env:
          ENOUGH_KEYSTORE_PASSWORD: ${{ secrets.ENOUGH_KEYSTORE_PASSWORD }}
          ENOUGH_KEY_ALIAS: ${{ secrets.ENOUGH_KEY_ALIAS }}
          ENOUGH_KEY_PASSWORD: ${{ secrets.ENOUGH_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --console=plain

      - name: Verify signature and name the APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee signer.txt
          grep -q "CN=Enough" signer.txt
          OUT="enough-${APP_VERSION}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$OUT" "$OUT.sha256" \
            --title "Enough $APP_VERSION" --generate-notes --verify-tag

      - name: Remove key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
