name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Enough is intentionally hard to switch off. Ideas that weaken that are unlikely to be accepted. Check [docs/requirements.md](https://github.com/defUserName-404/enough/blob/main/docs/requirements.md) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Enough doesn't support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you implement it?
      options:
        - "Yes"
        - "Maybe, with guidance"
        - "No"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/defUserName-404/enough/blob/main/CODE_OF_CONDUCT.md)
          required: true
